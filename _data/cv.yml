- title: Research Experience
  type: time_table
  contents:
    - title: Graduate Student Research Assistant
      institution: Lindsey Group & Glotzer Group, University of Michigan
      year: Oct. 2022 – Present
      description:
        - title: Machine-Learning Framework for Inverse Design of Polymer-Grafted Nanoparticles
          contents:
            - Developed a machine-learning interaction framework integrated with digital alchemy inverse design, enabling direct optimization of polymer-grafted nanoparticle physicochemical attributes toward target self-assembled structures.
            - Designed an enhanced sampling strategy that concentrates training data in physically relevant regions of configuration space, improving sampling efficiency by approximately 10× while retaining accuracy.
        - title: Orientation-Aware Machine-Learning Model for Anisotropic Nanoparticle Interactions
          contents:
            - Designed and implemented a generalized, orientation-dependent machine-learning interaction model for anisotropic nanoparticles, extending machine-learned interaction modeling to particles with non-spherical shapes and directional interactions.
            - Established physics-informed training strategies that exploit known particle symmetries and adaptive refinement to focus sampling on symmetry-distinct, high-information configurations, reducing required training data by approximately 100× while improving data quality and model quality.
            - Enabled molecular dynamics simulations with the anisotropic interaction model, extending the framework beyond static energy prediction to dynamical simulations of nanoparticle self-assembly.
        - title: Machine-Learned Design Coordinates for Sequence-Defined Nanoparticles
          contents:
            - Developed a method that learns continuous coordinates for discrete ligand sequences together with a physics-based model of particle interactions, enabling inverse design directly on the fitted interaction model without a separate black-box predictor.
            - Demonstrated that monomer sequence order, rather than composition alone, can strongly alter nanoparticle interactions, establishing ligand sequence as an independent design variable for controlling self-assembly.
    - title: Undergraduate Research Assistant
      institution: Dou Group, Purdue University
      year: Jan. 2020 – May 2022
      description:
        - Synthesized ligand-assisted perovskites for defect passivation and phase stabilization, achieving photovoltaic devices with 20.1% power conversion efficiency.
        - Streamlined photovoltaic device data analysis for rapid evaluation of performance and ambient stability.

